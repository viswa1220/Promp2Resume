# Declares what this service needs to run.
# `uv sync` reads this file, creates .venv/, and installs into it.

[project]
name = "buildora-ai"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",          # the web framework
    "uvicorn[standard]>=0.32", # the server that runs it
    "sqlalchemy>=2.0",         # talks to Postgres in Python instead of SQL
    "psycopg[binary]>=3.2",    # the Postgres driver SQLAlchemy uses
    "python-dotenv>=1.0",      # loads .env so DATABASE_URL is available
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
