# Render Blueprint for the Prompt2Resume backend (Express + Prisma).
# In Render: New + > Blueprint, point it at this repo. Render reads this file,
# creates the service, and prompts you to fill in the secret env values below.
#
# The frontend deploys separately on Vercel (see DEPLOY.md) — not from here.

services:
  - type: web
    name: prompt2resume-api
    runtime: node
    plan: free                 # bump to "starter" to avoid cold-start sleeps
    region: oregon             # pick the region closest to your Supabase project
    rootDir: backend
    branch: owner
    # `npm run setup` = prisma generate && prisma db push && seed admin.
    buildCommand: npm install && npm run setup
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production       # flips auth cookies to SameSite=None; Secure
      - key: NODE_VERSION
        value: "22"

      # --- Secrets: set these in the Render dashboard (sync:false = not in git) ---
      - key: DATABASE_URL       # Supabase SESSION POOLER URI, port 5432
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Comma-separated list of allowed origins (prod + Vercel preview URLs).
      - key: FRONTEND_URL
        sync: false
      # This API's own public URL — builds the one-click approve/reject email
      # links. e.g. https://prompt2resume-api.onrender.com
      - key: API_URL
        sync: false
      # --- Email (Gmail SMTP). GMAIL_APP_PASSWORD is a Google App Password. ---
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

      # --- Auto-generated once and kept stable across deploys ---
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # --- Optional ---
      - key: AI_MODEL
        value: claude-sonnet-4-6

  # Daily learning-topic email — runs once a day (13:00 UTC). Emails each
  # opted-in user a topic personalised from their "Learn by building" profile.
  - type: cron
    name: prompt2resume-daily-learning
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    schedule: "0 13 * * *"     # daily at 13:00 UTC — adjust to your timezone
    buildCommand: npm install && npx prisma generate
    startCommand: npm run daily:learning
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: AI_MODEL
        value: claude-sonnet-4-6
